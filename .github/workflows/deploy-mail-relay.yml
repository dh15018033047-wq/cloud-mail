name: Deploy velune-mail-relay worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy relay worker
        working-directory: ./mail-relay
        run: npx wrangler@4 deploy
      - name: Configure relay secrets
        working-directory: ./mail-relay
        env:
          RELAY_KEY: ${{ secrets.VELUNE_RELAY_KEY }}
          SMTP_USER: ${{ secrets.VELUNE_SMTP_USER }}
          SMTP_PASS: ${{ secrets.VELUNE_SMTP_PASS }}
        run: |
          set -euo pipefail
          printf '%s' "$RELAY_KEY" | npx wrangler@4 secret put RELAY_KEY --name velune-mail-relay
          printf '%s' "$SMTP_USER" | npx wrangler@4 secret put SMTP_USER --name velune-mail-relay
          printf '%s' "$SMTP_PASS" | npx wrangler@4 secret put SMTP_PASS --name velune-mail-relay
