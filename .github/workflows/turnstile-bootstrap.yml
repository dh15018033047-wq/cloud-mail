name: turnstile-bootstrap
on:
  workflow_dispatch:
    inputs:
      action:
        description: list_or_create
        required: true
        default: list
      name:
        description: widget_name
        required: false
        default: sub2api-public
      domains:
        description: comma_separated_domains
        required: false
        default: liable-automobiles-usual-motorcycle.trycloudflare.com,2889372.xyz,mail.2889372.xyz
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Turnstile list or create
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACTION: ${{ inputs.action }}
          WIDGET_NAME: ${{ inputs.name }}
          DOMAINS: ${{ inputs.domains }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/challenges/widgets"
          echo "Listing existing widgets..."
          curl -sS -H "$AUTH" -H "Content-Type: application/json" "$BASE" | tee /tmp/widgets.json | jq '{success, result: [.result[]? | {sitekey, name, domains, mode, created_on}]}'
          if [ "$ACTION" = "create" ]; then
            EXISTING=$(jq -r --arg n "$WIDGET_NAME" '.result[]? | select(.name==$n) | .sitekey' /tmp/widgets.json | head -n1)
            if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
              echo "Reusing existing widget name=$WIDGET_NAME"
              jq --arg n "$WIDGET_NAME" '.result[]? | select(.name==$n)' /tmp/widgets.json > /tmp/widget.json
            else
              DOMS_JSON=$(python3 -c "import os,json; print(json.dumps([d.strip() for d in os.environ['DOMAINS'].split(',') if d.strip()]))")
              BODY=$(jq -n --arg name "$WIDGET_NAME" --argjson domains "$DOMS_JSON" '{name:$name, domains:$domains, mode:"managed"}')
              echo "Creating widget..."
              curl -sS -X POST -H "$AUTH" -H "Content-Type: application/json" --data "$BODY" "$BASE" | tee /tmp/create.json | jq '{success, errors, result: (.result | {sitekey, secret, name, domains, mode})}'
              jq '.result' /tmp/create.json > /tmp/widget.json
            fi
          else
            jq --arg d "$DOMAINS" '($d|split(",")) as $want | .result | (map(select((.domains//[]) as $dd | any($want[]; . as $w | ($dd|index($w))))) | .[0]) // .[0] // empty' /tmp/widgets.json > /tmp/widget.json
          fi
          echo "Selected:"
          jq '{sitekey, name, domains, mode, has_secret:(.secret!=null)}' /tmp/widget.json
          mkdir -p out
          jq '{site_key:.sitekey, secret_key:(.secret//""), name:.name, domains:.domains, mode:.mode, note:(if .secret then "secret from create response" else "list API does not return secret; create or rotate if missing" end)}' /tmp/widget.json > out/turnstile-keys.json
          jq '{success, widgets:[.result[]?|{sitekey,name,domains,mode}]}' /tmp/widgets.json > out/turnstile-widgets.json
      - name: Upload keys artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnstile-keys
          path: out/
          retention-days: 1
