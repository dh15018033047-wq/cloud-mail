name: turnstile-bootstrap
on:
  workflow_dispatch:
    inputs:
      action:
        description: list_or_create_or_verify
        required: true
        default: verify
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Verify CF token and Turnstile perms
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          echo "account_id_len=${#CLOUDFLARE_ACCOUNT_ID}"
          echo "token_len=${#CLOUDFLARE_API_TOKEN}"
          curl -sS -X GET "https://api.cloudflare.com/client/v4/user/tokens/verify" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" | tee /tmp/verify.json | jq '{success, status:.result.status, id:(.result.id|tostring|.[0:8]+"***")}'
          curl -sS -X GET "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" | tee /tmp/acct.json | jq '{success, errors, name:.result.name, id:(.result.id|tostring|.[0:8]+"***")}'
          curl -sS -X GET "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/challenges/widgets" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" | tee /tmp/widgets.json | jq '{success, errors, count:(.result|length)}'
          # Probe create with minimal body to capture exact auth error code
          BODY='{"name":"sub2api-public","domains":["2889372.xyz"],"mode":"managed"}'
          curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/challenges/widgets" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" --data "$BODY" | tee /tmp/create.json | jq '{success, errors, result_sitekey:(.result.sitekey//null)}'
          mkdir -p out
          jq -n --slurpfile v /tmp/verify.json --slurpfile c /tmp/create.json --slurpfile w /tmp/widgets.json '{verify:$v[0], widgets_count:(($w[0].result//[])|length), create:$c[0]}' > out/diagnose.json
          # If create succeeded, save keys
          if jq -e '.success==true and .result.sitekey and .result.secret' /tmp/create.json >/dev/null; then
            jq '{site_key:.result.sitekey, secret_key:.result.secret, name:.result.name, domains:.result.domains}' /tmp/create.json > out/turnstile-keys.json
          else
            echo '{"ok":false,"reason":"create_failed_or_missing_turnstile_edit_permission"}' > out/turnstile-keys.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: turnstile-keys
          path: out/
          retention-days: 1
