name: Bootstrap Cloud Mail Admin

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ./mail-worker/pnpm-lock.yaml
      - name: Install deps
        working-directory: ./mail-worker
        run: pnpm install --frozen-lockfile
      - name: Reset admin password + enable multi mailbox
        working-directory: ./mail-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN: ${{ secrets.ADMIN }}
        run: |
          set -euo pipefail
          PASS='GrokMail2026!'
          SALT=$(node -e "console.log(require('crypto').randomBytes(16).toString('base64'))")
          HASH=$(node -e "const s=process.argv[1],p=process.argv[2];console.log(require('crypto').createHash('sha256').update(Buffer.from(s+p,'utf8')).digest('base64'))" "$SALT" "$PASS")
          echo "Admin secret set: $([ -n "$ADMIN" ] && echo yes || echo no)"
          # list d1
          pnpm wrangler d1 list || true
          # enable multi email
          pnpm wrangler d1 execute cloud-mail --remote --command "UPDATE setting SET many_email=1, add_email=1 WHERE 1=1;" || true
          # reset password for ADMIN and known address
          if [ -n "${ADMIN:-}" ]; then
            ESC_ADMIN=$(printf "%s" "$ADMIN" | sed "s/'/''/g")
            pnpm wrangler d1 execute cloud-mail --remote --command "UPDATE user SET password='$HASH', salt='$SALT' WHERE email='$ESC_ADMIN' COLLATE NOCASE;" || true
          fi
          pnpm wrangler d1 execute cloud-mail --remote --command "UPDATE user SET password='$HASH', salt='$SALT' WHERE email='admin@2889372.xyz' COLLATE NOCASE;" || true
          echo "BOOTSTRAP_DONE password=GrokMail2026!"
